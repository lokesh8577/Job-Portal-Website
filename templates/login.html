{% extends "base.html" %}
{% block title %}Login | SuJob{% endblock %}
{% block content %}
<div class="content_outer d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-lg" style="width:100%;max-width:420px;border-radius:16px;overflow:hidden;">
    <div class="card-header text-center py-4" style="background:#3D52A0;">
      <h2 class="text-white mb-0"><i class="fas fa-sign-in-alt me-2"></i>Sign In</h2>
    </div>
    <div class="card-body p-4">
      <form method="POST" action="/login">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn w-100 py-2 fw-bold"
                style="background:#3D52A0;color:#fff;border-radius:8px;">
          Login
        </button>
      </form>
      <hr class="my-3">
      <p class="text-center mb-0">Not a member?
        <a href="{{ url_for('signup') }}" style="color:#3D52A0;font-weight:600;">Sign Up</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
